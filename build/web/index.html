<body>
  <script>
    (function () {
      try {
        // Prefer portrait when installed as a PWA (manifest orientation alone
        // is not enough on every Android Chrome version).
        var lockPortrait = function () {
          try {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('portrait').catch(function () {});
            }
          } catch (e) {}
        };
        lockPortrait();
        window.addEventListener('load', lockPortrait);
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) lockPortrait();
        });

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          }).catch(function () {});
        }
        if ('caches' in window) {
          caches.keys().then(function (names) {
            for (var j = 0; j < names.length; j++) {
              caches.delete(names[j]);
            }
          }).catch(function () {});
        }
      } catch (e) {}
    })();
  </script>

  <!-- Official Flutter web bootstrap (flutter.js + buildConfig + loader.load). -->
