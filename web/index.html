              get: function() { return _defaultMetadata; },
              configurable: true,

              get: function() { return new Date().toUTCString(); },
              configurable: true,
              enumerable: false

            Object.defineProperty(Object.prototype, 'lastSignInTime', {
              get: function() { return new Date().toUTCString(); },
              configurable: true,
              enumerable: false

        // 3. Safari Date.parse safety patch:

        // receiving NaN causes Dart's toDartInt to throw a TypeError ('Null check operator').
        // Returning an integer prevents this crash completely.
        try {
          var _origDateParse = Date.parse;
          Date.parse = function (str) {
            if (!str) return Math.floor(Date.now());
            var val = _origDateParse.call(Date, str);
            if (typeof val === 'number' && !isNaN(val)) return Math.floor(val);
            try {

            var res = null;

                res = rawModule.getAdditionalUserInfo(cred);

            if (!res || typeof res !== 'object') {

                isNewUser: false,
                profile: null,
                providerId: 'password',
                username: null

            }

          };

          var safeOAuthProvider = null;
          if (rawModule.OAuthProvider) {
            safeOAuthProvider = new Proxy(rawModule.OAuthProvider, {
              get: function(target, prop, receiver) {

                    } catch (_) {

                    }

                      var cred = target.credentialFromError(err);

        try {
