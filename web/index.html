  <script>
    (function () {
      try {
        // Prefer portrait when installed as a PWA (manifest orientation alone
        // is not enough on every Android Chrome version).
        var lockPortrait = function () {
          try {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('portrait').catch(function () {});
            }
          } catch (e) {}
        };
        lockPortrait();
        window.addEventListener('load', lockPortrait);
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) lockPortrait();
        });

        // 1. Prevent TypeError on exception.customData in firebase_auth_web:
        try {
          if (!('customData' in Error.prototype)) {
            Object.defineProperty(Error.prototype, 'customData', {
              value: {},
              writable: true,
              configurable: true
            });
          }
        } catch (_) {}

        // 2. Safari Date.parse safety patch:
        // Safari returns NaN for non-ISO or empty/null date strings in Date.parse().
        // When firebase_auth_web converts creationTime / lastSignInTime with Date.parse(),
        // receiving NaN causes Dart's toDartInt to throw a TypeError ('Null check operator').
        // Returning an integer prevents this crash completely.
        try {
          var _origDateParse = Date.parse;
          Date.parse = function (str) {
            if (!str) return Math.floor(Date.now());
            var val = _origDateParse.call(Date, str);
            if (isNaN(val)) {
              try {
                var s = String(str).trim();
                val = _origDateParse.call(Date, s.replace(/(\d{4}) (\d{2}):/, '$1T$2:'));
              } catch (_) {}
            }
            return (typeof val === 'number' && !isNaN(val)) ? Math.floor(val) : Math.floor(Date.now());
          };
        } catch (_) {}

        // 3. Patch OAuthProvider.credentialFromError in firebase_auth:
        // In firebase_auth_web, getFirebaseAuthException calls
        // `OAuthProvider.credentialFromError(error)`.
        // If it returns an object where providerId is missing/null,
        // Dart throws 'Null check operator used on a null value'.
        var _patchFirebaseAuth = function() {
          try {
            if (window.firebase_auth && window.firebase_auth.OAuthProvider) {
              if (!window.firebase_auth.OAuthProvider._safetyHookInstalled) {
                window.firebase_auth.OAuthProvider._safetyHookInstalled = true;
                var _origCredFromError = window.firebase_auth.OAuthProvider.credentialFromError;
                window.firebase_auth.OAuthProvider.credentialFromError = function(e) {
                  try {
                    var cred = _origCredFromError ? _origCredFromError.call(window.firebase_auth.OAuthProvider, e) : null;
                    if (cred && (!cred.providerId || !cred.signInMethod)) {
                      return null;
                    }
                    return cred;
                  } catch (_) {
                    return null;
                  }
                };
              }
            }
          } catch (_) {}
        };
        _patchFirebaseAuth();
        setInterval(_patchFirebaseAuth, 250);

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          }).catch(function () {});
        }
        if ('caches' in window) {
          caches.keys().then(function (names) {
            for (var j = 0; j < names.length; j++) {
              caches.delete(names[j]);
            }
          }).catch(function () {});
        }
      } catch (e) {}
    })();
  </script>
