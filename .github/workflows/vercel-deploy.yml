# Vercel production deploys are handled by the GitHub ↔ Vercel project link
# (minushanimsaras-projects/aero-fit-slul). This workflow only verifies the
# committed Flutter web bundle so broken pushes are caught early.
name: Verify web build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static build
        run: |
          test -f web/main.dart.js
          test -f web/index.html
          test -f vercel.json
          echo "web/ bundle OK — Vercel Git integration will deploy on push to main"
